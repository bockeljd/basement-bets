
name: NCAAM Frequent Jobs

on:
  schedule:
    # Jittered off-minute crons avoid GitHub's :00/:15/:30/:45 queue throttling ($0 free)
    # 30m cadence across active daytime & evening slate (15:00-03:59 UTC / 10am-11pm EST)
    - cron: '13,43 15-23 * * *'
    - cron: '13,43 0-3 * * *'
    - cron: '12,42 11-14 * * *'
    - cron: '17 4-10 * * *'
  workflow_dispatch:
    inputs:
      backfill_pending:
        description: 'Backfill and grade all historical pending predictions'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ncaam-frequent-jobs
  cancel-in-progress: false

jobs:
  run-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DB_REUSE_CONNECTION: "1"
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          pip install -r requirements-worker.txt

      - name: Ingest Odds
        if: ${{ !inputs.backfill_pending }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 src/scripts/ingest_odds.py

      - name: Build Market Consensus
        if: ${{ !inputs.backfill_pending }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 src/scripts/build_market_consensus.py

      - name: Ingest Haslametrics (if stale > 4h)
        if: ${{ !inputs.backfill_pending }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 src/scripts/ingest_haslametrics.py --if-stale-hours 4 || echo "⚠️ Haslametrics warning (continuing)"

      - name: Ingest Live Enrichment (Action Splits, ESPN Refs, Injuries)
        if: ${{ !inputs.backfill_pending }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 src/scripts/ingest_enrichment_live.py || echo "⚠️ Enrichment warning (continuing)"

      - name: Update Data Health
        if: ${{ !inputs.backfill_pending }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 src/scripts/update_data_health.py

      - name: Build Daily Top Picks
        if: ${{ !inputs.backfill_pending }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_REUSE_CONNECTION: "1"
        run: python3 src/scripts/build_daily_top_picks.py

      - name: Refresh rolling Top 6
        if: ${{ !inputs.backfill_pending }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 -c "import json; from src.services.ncaam_publisher import publish_slate; res = publish_slate(); print('[TOP6_PUBLISH]', json.dumps(res, default=str))"

      - name: Sync Official Daily Parlay
        if: ${{ !inputs.backfill_pending }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python3 - <<'PY' || echo "⚠️ Official parlay sync warning (continuing)"
          import json
          from src.services.ncaam_parlay_service import compute_ncaam_parlays_today
          res = compute_ncaam_parlays_today(persist=False)
          odp = res.get("official_daily_parlay") or {}
          print(
              "[PARLAY_SYNC]",
              json.dumps(
                  {
                      "date_et": res.get("date_et"),
                      "has_parlay": bool(odp),
                      "is_locked": odp.get("is_locked"),
                      "locks_at": odp.get("locks_at"),
                      "odds": odp.get("american_odds"),
                  },
                  default=str,
              ),
          )
          PY

      - name: Verify Daily Top Picks & Live Top 6 (today ET)
        if: ${{ !inputs.backfill_pending }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python3 - <<'PY'
          import json
          import psycopg2
          import psycopg2.extras
          import os

          dsn = os.environ.get('DATABASE_URL')
          assert dsn, 'DATABASE_URL missing'

          conn = psycopg2.connect(dsn, cursor_factory=psycopg2.extras.DictCursor)
          cur = conn.cursor()
          cur.execute("SELECT (NOW() AT TIME ZONE 'America/New_York')::date::text")
          today = cur.fetchone()[0]

          cur.execute("""
            SELECT COUNT(*) AS n,
                   SUM(CASE WHEN is_actionable THEN 1 ELSE 0 END) AS n_action,
                   SUM(CASE WHEN NOT is_actionable AND (LOWER(COALESCE(reason,'')) LIKE '%%no line%%' OR LOWER(COALESCE(reason,'')) LIKE '%%waiting%%' OR LOWER(COALESCE(reason,'')) LIKE '%%stale%%') THEN 1 ELSE 0 END) AS n_stale,
                   SUM(CASE WHEN NOT is_actionable AND LOWER(COALESCE(reason,'')) NOT LIKE '%%no line%%' AND LOWER(COALESCE(reason,'')) NOT LIKE '%%waiting%%' AND LOWER(COALESCE(reason,'')) NOT LIKE '%%stale%%' THEN 1 ELSE 0 END) AS n_true_pass,
                   MAX(computed_at)::text AS latest_computed_at
            FROM daily_top_picks
            WHERE date_et=%s AND league='NCAAM'
          """, (today,))
          row = cur.fetchone()
          n = int(row['n'] or 0)
          n_action = int(row['n_action'] or 0)
          n_stale = int(row['n_stale'] or 0)
          n_true_pass = int(row['n_true_pass'] or 0)

          print(f"daily_top_picks for {today}: total={n} actionable={n_action} true_no_bet={n_true_pass} stale_or_missing_odds={n_stale} latest_computed_at={row['latest_computed_at']}")

          cur.execute("""
            SELECT d.event_id, e.away_team, e.home_team, e.start_time::text AS start_time,
                   d.is_actionable, d.reason, d.rec_json
            FROM daily_top_picks d
            JOIN events e ON e.id = d.event_id
            WHERE d.date_et=%s AND d.league='NCAAM'
            ORDER BY d.is_actionable DESC, e.start_time ASC
          """, (today,))
          for r in cur.fetchall():
            rec = r['rec_json'] if isinstance(r['rec_json'], dict) else (json.loads(r['rec_json']) if r['rec_json'] else {})
            if r['is_actionable']:
              print(f"  [ACTIONABLE] {r['away_team']} @ {r['home_team']} ({r['start_time']}) -> {rec.get('selection')} ({rec.get('price')}) book={rec.get('book')} ev={rec.get('edge')} top6_eligible={rec.get('top6_eligible')}")
            else:
              print(f"  [PASS/HOLD]  {r['away_team']} @ {r['home_team']} ({r['start_time']}) -> reason={r['reason']}")

          if n == 0:
            raise SystemExit(2)
          PY

      - name: Ingest Results
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 src/scripts/ingest_results.py
          
      - name: Run Settlement
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 src/scripts/run_settlement.py

      - name: Backfill Season Neutral-Site Metadata
        if: ${{ inputs.backfill_pending }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 src/scripts/backfill_ncaam_neutral_sites.py --days 25

      - name: Grade Predictions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GRADING_BACKFILL_PENDING: ${{ inputs.backfill_pending == true && '1' || '0' }}
        run: |
          if [ "${GRADING_BACKFILL_PENDING}" = "1" ]; then
            python3 src/scripts/grade_predictions.py --backfill-pending --max-grade-rows 5000
          else
            python3 src/scripts/grade_predictions.py
          fi

      - name: Trigger Agent Council
        env:
          BASEMENT_BETS_URL: ${{ secrets.BASEMENT_BETS_URL }}
          BASEMENT_CRON_SECRET: ${{ secrets.BASEMENT_CRON_SECRET }}
        run: |
          set -euo pipefail

          diag_url="${BASEMENT_BETS_URL%/}/api/jobs/diag_auth"
          url="${BASEMENT_BETS_URL%/}/api/jobs/run_council_today"

          echo "Auth diagnostic: ${diag_url}"
          curl -sS -X GET \
            -H "Authorization: Bearer ${BASEMENT_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --fail-with-body "${diag_url}" || true

          echo "Triggering Agent Council: ${url}?max_events=1"
          curl -sS -X POST --max-time 55 \
            -H "Authorization: Bearer ${BASEMENT_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --fail-with-body "${url}?max_events=1"
