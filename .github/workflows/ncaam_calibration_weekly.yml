name: Weekly NCAAM Win-Prob Calibration

on:
  schedule:
    # Weekly every Monday at 12:00 UTC (7:00 AM EST / 8:00 AM EDT)
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ncaam-calibration-weekly
  cancel-in-progress: true

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-worker.txt

      - name: Install dependencies
        run: pip install -r requirements-worker.txt

      - name: Build PAVA Win-Probability Calibration (NCAAM & MLB) & Confidence Params
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python3 scripts/build_winprob_calibration_ncaam.py --league NCAAM --days 30 --min-obs 50
          python3 scripts/build_winprob_calibration_ncaam.py --league MLB --days 365 --min-obs 150
          python3 scripts/build_model_confidence_params_ncaam.py --days 365

      - name: Commit Updated Calibration Curve (if changed)
        run: |
          if [ -n "$(git status --porcelain data/model_params src/services/model_params)" ]; then
            git config user.name "Basement Bets Calibration Bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/model_params/winprob_calibration_*.json src/services/model_params/winprob_calibration_*.json data/model_params/model_confidence_params_ncaam.json src/services/model_params/model_confidence_params_ncaam.json
            git commit -m "chore(model): refresh PAVA win-prob calibration and confidence params"
            git push
          else
            echo "No calibration changes to commit."
          fi
