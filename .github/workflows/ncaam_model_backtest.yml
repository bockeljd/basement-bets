name: NCAAM Model Backtest (Staging)

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        required: true
        default: "14"
      mode:
        description: "Backtest mode: mae|simulate"
        required: true
        default: "simulate"
      limit:
        description: "Max games"
        required: true
        default: "200"
      w_base:
        description: "Override: NCAAM_W_BASE (blank = dynamic by month)"
        required: false
        default: ""
      w_kenpom:
        description: "Override: NCAAM_W_KENPOM (blank = dynamic)"
        required: false
        default: ""
      cap_spread:
        description: "Override: NCAAM_CAP_SPREAD (blank = dynamic)"
        required: false
        default: ""
      cap_total:
        description: "Override: NCAAM_CAP_TOTAL (blank = dynamic)"
        required: false
        default: ""

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements-worker.txt

      - name: Run backtest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKTEST_DAYS: ${{ inputs.days }}
          BACKTEST_LIMIT: ${{ inputs.limit }}
          BACKTEST_MODE: ${{ inputs.mode }}
          BACKTEST_NO_NETWORK: "1"
          NCAAM_W_BASE: ${{ inputs.w_base }}
          NCAAM_W_KENPOM: ${{ inputs.w_kenpom }}
          NCAAM_CAP_SPREAD: ${{ inputs.cap_spread }}
          NCAAM_CAP_TOTAL: ${{ inputs.cap_total }}
        run: |
          # Only export override env vars when explicitly provided (blank = production dynamic weights/caps)
          [ -n "${NCAAM_W_BASE}" ] || unset NCAAM_W_BASE
          [ -n "${NCAAM_W_KENPOM}" ] || unset NCAAM_W_KENPOM
          [ -n "${NCAAM_CAP_SPREAD}" ] || unset NCAAM_CAP_SPREAD
          [ -n "${NCAAM_CAP_TOTAL}" ] || unset NCAAM_CAP_TOTAL
          python3 -u src/scripts/backtest_ncaam_model.py

      - name: Upload backtest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-output
          path: |
            backtest_output.json
          if-no-files-found: ignore

      - name: Summary
        run: |
          echo "✅ Backtest finished at $(date)"