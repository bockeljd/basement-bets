name: NCAAM Top 6 cutoff checks
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-cutoffs:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Record eligible picks due at their 30-minute cutoff
        env:
          BASE_URL: ${{ secrets.BASEMENT_BETS_URL }}
          CRON_SECRET: ${{ secrets.BASEMENT_CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 55 --retry 1 \
            -H "Authorization: Bearer ${CRON_SECRET}" "${BASE_URL%/}/api/jobs/ncaam_top6_cutoffs"
